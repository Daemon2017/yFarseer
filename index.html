<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yFarseer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/variables.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/actions.js" defer></script>
</head>
<body>
<main class="container">
    <div class="top-panel">
        <section class="card left-input">
            <h2>Raw data</h2>
            <div class="content-area">
                <label for="raw-haplotype" class="visually-hidden">Enter raw haplotype data</label>
                <textarea id="raw-haplotype"
                          placeholder="13 25 16 10 12-13 12 13 10 12 11 28 15 9-10 11 11 24 14 20 33 13-15-16-16 10 10 19-23 15 16 18 20 33-36 13 11 11 8 17-17 8 12 10 8 9 10 12 20-22 15 10 12 12 14 8 13 23 21 12 12 11 13 11 11 12 13 32 15 9 15 12 25 27 19 12 12 12 12 10 9 12 11 10 11 11 31 12 13 24 13 9 10 18 15 19 11 22 14 15 15 24 12 23 19 10 15 17 9 11 11"></textarea>
            </div>
            <button id="parse-btn" type="button">Parse <span aria-hidden="true">➔</span></button>
        </section>
        <section class="card right-output">
            <h2>Table data</h2>
            <div class="markers-grid" id="markers-container">
            </div>
            <div class="select-group">
                <label for="confidence-level">Confidence:</label>
                <select id="confidence-level">
                    <option value="0.95">0.95</option>
                    <option value="0.90">0.90</option>
                    <option value="0.75">0.75</option>
                    <option value="0.66">0.66</option>
                    <option value="0.50" selected>0.50</option>
                </select>
            </div>
            <button id="predict-btn" type="button">Predict <span aria-hidden="true">▼</span></button>
        </section>
    </div>
    <section class="card tree-container">
        <h2>Topology</h2>
        <div id="tree-result">
            <p class="placeholder-text">Press "Predict" to get topology.</p>
        </div>
    </section>
</main>
</body>
</html>
